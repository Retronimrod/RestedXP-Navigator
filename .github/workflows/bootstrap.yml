name: Bootstrap repository

on:
  push:
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import RestedXP-Navigator v1.4.0
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .bootstrap/part00 ]; then
            echo "Bootstrap data already removed; nothing to do."
            exit 0
          fi

          cat .bootstrap/part* > /tmp/restedxp.tar.xz.b64
          base64 --decode /tmp/restedxp.tar.xz.b64 > /tmp/restedxp.tar.xz
          xz --test /tmp/restedxp.tar.xz
          tar -xJf /tmp/restedxp.tar.xz -C .

          rm -rf .bootstrap .bootstrap32

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "Import RestedXP-Navigator v1.4.0"
          git push origin HEAD:main
