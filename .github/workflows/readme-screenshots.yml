name: Add README screenshots

on:
  push:
    paths:
      - ".shotbootstrap/**"
      - ".github/workflows/readme-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add screenshots
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .shotbootstrap/data.b64 > /tmp/rxp_shots.tar.xz
          xz --test /tmp/rxp_shots.tar.xz
          tar -xJf /tmp/rxp_shots.tar.xz -C .
          rm -rf .shotbootstrap
          rm -f .github/workflows/readme-screenshots.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add README screenshots"
          git push origin HEAD:main
