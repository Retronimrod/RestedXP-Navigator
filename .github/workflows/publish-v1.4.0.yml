name: Publish v1.4.0

on:
  push:
    paths:
      - ".github/workflows/publish-v1.4.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="${{ github.event.before }}"
          if [ -z "$TARGET_SHA" ] || [ "$TARGET_SHA" = "0000000000000000000000000000000000000000" ]; then
            TARGET_SHA="$(git rev-parse HEAD^)"
          fi

          mkdir -p /tmp/rxp-release/RXP_Navigator
          git archive "$TARGET_SHA" Core Debug Docs Map Media UI RXP_Navigator.toc LICENSE README.md | tar -x -C /tmp/rxp-release/RXP_Navigator
          cd /tmp/rxp-release
          zip -qr RestedXP-Navigator-v1.4.0.zip RXP_Navigator

          git -C "$GITHUB_WORKSPACE" show "$TARGET_SHA:Docs/RELEASE-v1.4.0.md" > /tmp/release-notes.md

          git -C "$GITHUB_WORKSPACE" tag -a v1.4.0 "$TARGET_SHA" -m "RestedXP-Navigator v1.4.0"
          git -C "$GITHUB_WORKSPACE" push origin v1.4.0

          gh release create v1.4.0             /tmp/rxp-release/RestedXP-Navigator-v1.4.0.zip             --repo "$GITHUB_REPOSITORY"             --title "RestedXP-Navigator v1.4.0"             --notes-file /tmp/release-notes.md             --verify-tag

      - name: Remove one-time release workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-v1.4.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time v1.4.0 release workflow"
          git push origin HEAD:main
