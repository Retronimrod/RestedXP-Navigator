name: Set repository metadata

on:
  push:
    paths:
      - ".github/workflows/set-metadata.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Update repository description
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY"             -f description="Visual navigation companion for RestedXP Guides on WoW Forever — Minimap, World Map, HUD, travel routing, quest-object markers and Grind XP progress."             -f homepage="https://www.curseforge.com/wow/addons/restedxp-navigator"
      - name: Remove one-time metadata workflow
        run: |
          rm -f .github/workflows/set-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time metadata workflow"
          git push origin HEAD:main
