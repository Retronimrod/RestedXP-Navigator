name: Publish to CurseForge

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish manually, for example v1.4.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_PROJECT_ID: "1722407"
      CURSEFORGE_API_BASE: "https://www.curseforge.com/api"
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGED }}
      CURSEFORGE_GAME_VERSION: "1.60.1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release context
        id: ctx
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi

          case "$TAG" in
            *alpha*) RELEASE_TYPE="alpha" ;;
            *beta*|*rc*) RELEASE_TYPE="beta" ;;
            *) RELEASE_TYPE="release" ;;
          esac

          BODY_FILE="$RUNNER_TEMP/release_body.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$BODY_FILE" || true

          if [ ! -s "$BODY_FILE" ] || ! grep -q '[^[:space:]]' "$BODY_FILE"; then
            ALT_DOC="Docs/RELEASE-${TAG}.md"
            if git cat-file -e "$TAG:$ALT_DOC" 2>/dev/null; then
              git show "$TAG:$ALT_DOC" > "$BODY_FILE"
            else
              echo "RestedXP-Navigator $TAG" > "$BODY_FILE"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "archive_name=RestedXP-Navigator-$TAG.zip" >> "$GITHUB_OUTPUT"

      - name: Download GitHub release asset
        id: download_asset
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfupload"
          gh release download "${{ steps.ctx.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "${{ steps.ctx.outputs.archive_name }}" --dir "$RUNNER_TEMP/cfupload"

      - name: Build archive if release asset is missing
        if: steps.download_asset.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfupload/RXP_Navigator"
          git archive "${{ steps.ctx.outputs.tag }}" Core Debug Docs Map Media UI RXP_Navigator.toc LICENSE README.md | tar -x -C "$RUNNER_TEMP/cfupload/RXP_Navigator"
          cd "$RUNNER_TEMP/cfupload"
          zip -qr "${{ steps.ctx.outputs.archive_name }}" RXP_Navigator

      - name: Create CurseForge metadata
        shell: bash
        run: |
          set -euo pipefail
          jq -n --rawfile changelog "${{ steps.ctx.outputs.body_file }}" --arg displayName "RestedXP-Navigator ${{ steps.ctx.outputs.tag }}" --arg gameVersion "$CURSEFORGE_GAME_VERSION" --arg releaseType "${{ steps.ctx.outputs.release_type }}" '{changelog:$changelog,changelogType:"markdown",displayName:$displayName,gameVersionNames:[$gameVersion],releaseType:$releaseType}' > "$RUNNER_TEMP/curseforge-metadata.json"

      - name: Upload to CurseForge
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CURSEFORGE_TOKEN"
          curl --fail --show-error --silent -H "X-Api-Token: $CURSEFORGE_TOKEN" -F "metadata=@$RUNNER_TEMP/curseforge-metadata.json;type=application/json" -F "file=@$RUNNER_TEMP/cfupload/${{ steps.ctx.outputs.archive_name }};type=application/zip" "$CURSEFORGE_API_BASE/projects/$CURSEFORGE_PROJECT_ID/upload-file" | tee "$RUNNER_TEMP/curseforge-upload-response.json"

      - name: Show upload response
        shell: bash
        run: cat "$RUNNER_TEMP/curseforge-upload-response.json"
