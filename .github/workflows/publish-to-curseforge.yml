name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish manually (e.g. v1.4.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_PROJECT_ID: "1722407"
      CURSEFORGE_API_BASE: "https://www.curseforge.com/api"
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGED }}
      CURSEFORGE_GAME_VERSION: "1.60.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release context
        id: ctx
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            BODY_FILE="$RUNNER_TEMP/release_body.md"
            cat <<'BODYEOF' > "$BODY_FILE"
${{ github.event.release.body }}
BODYEOF
          elif [ -n "${{ github.event.inputs.tag || '' }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            BODY_FILE="$RUNNER_TEMP/release_body.md"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$BODY_FILE" || true
          else
            echo "No release tag supplied." >&2
            exit 1
          fi

          case "$TAG" in
            *alpha*) RELEASE_TYPE="alpha" ;;
            *beta*|*rc*) RELEASE_TYPE="beta" ;;
            *) RELEASE_TYPE="release" ;;
          esac

          if [ ! -s "$BODY_FILE" ] || ! grep -q '[^[:space:]]' "$BODY_FILE"; then
            ALT_DOC="Docs/RELEASE-${TAG}.md"
            if git cat-file -e "$TAG:$ALT_DOC" 2>/dev/null; then
              git show "$TAG:$ALT_DOC" > "$BODY_FILE"
            else
              echo "RestedXP-Navigator ${TAG}" > "$BODY_FILE"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "archive_name=RestedXP-Navigator-${TAG}.zip" >> "$GITHUB_OUTPUT"

      - name: Download GitHub release asset
        id: dl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfupload"
          gh release download "${{ steps.ctx.outputs.tag }}"             --repo "$GITHUB_REPOSITORY"             --pattern "${{ steps.ctx.outputs.archive_name }}"             --dir "$RUNNER_TEMP/cfupload"

      - name: Build archive from tag if asset is missing
        if: steps.dl.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfupload/RXP_Navigator"
          git archive "${{ steps.ctx.outputs.tag }}" Core Debug Docs Map Media UI RXP_Navigator.toc LICENSE README.md | tar -x -C "$RUNNER_TEMP/cfupload/RXP_Navigator"
          (
            cd "$RUNNER_TEMP/cfupload"
            zip -qr "${{ steps.ctx.outputs.archive_name }}" RXP_Navigator
          )

      - name: Create CurseForge metadata
        shell: bash
        env:
          BODY_FILE: ${{ steps.ctx.outputs.body_file }}
          TAG: ${{ steps.ctx.outputs.tag }}
          RELEASE_TYPE: ${{ steps.ctx.outputs.release_type }}
        run: |
          set -euo pipefail
          python3 <<'PY'
import json, os, pathlib

body_path = pathlib.Path(os.environ["BODY_FILE"])
metadata = {
    "changelog": body_path.read_text(encoding="utf-8"),
    "changelogType": "markdown",
    "displayName": f"RestedXP-Navigator {os.environ['TAG']}",
    "gameVersionNames": [os.environ["CURSEFORGE_GAME_VERSION"]],
    "releaseType": os.environ["RELEASE_TYPE"],
}
out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "curseforge-metadata.json"
out.write_text(json.dumps(metadata, ensure_ascii=False), encoding="utf-8")
print(out)
PY

      - name: Upload to CurseForge
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/cfupload/${{ steps.ctx.outputs.archive_name }}"
          META_PATH="$RUNNER_TEMP/curseforge-metadata.json"

          test -n "$CURSEFORGE_TOKEN"
          test -f "$ARCHIVE_PATH"
          test -f "$META_PATH"

          curl --fail --show-error --silent             -H "X-Api-Token: $CURSEFORGE_TOKEN"             -F "metadata=@$META_PATH;type=application/json"             -F "file=@$ARCHIVE_PATH;type=application/zip"             "$CURSEFORGE_API_BASE/projects/$CURSEFORGE_PROJECT_ID/upload-file"             | tee "$RUNNER_TEMP/curseforge-upload-response.json"

      - name: Show CurseForge upload response
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/curseforge-upload-response.json"
