name: Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CF_TOKEN: ${{ secrets.CURSEFORGED }}
      CF_PROJECT_ID: "1722407"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore staged source patch
        id: payload
        shell: bash
        run: |
          if [ -f ".release-payload/version.txt" ] && compgen -G ".release-payload/sourcepatch-*.txt" > /dev/null; then
            VERSION="$(tr -d '\r\n ' < .release-payload/version.txt)"
            echo "Applying staged source patch for v$VERSION"
            cat .release-payload/sourcepatch-*.txt | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/sourcepatch.tar.gz"
            tar -xzf "$RUNNER_TEMP/sourcepatch.tar.gz" -C .

            if [ -f README.md ]; then
              sed -i -E "s/version-[0-9]+\.[0-9]+\.[0-9]+-blue/version-$VERSION-blue/" README.md || true
            fi

            rm -rf .release-payload
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Sync source v$VERSION"
              git push origin HEAD:main
            fi
            echo "staged=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          if [ "${{ steps.payload.outputs.staged }}" = "true" ]; then
            VERSION="${{ steps.payload.outputs.version }}"
          else
            VERSION="$(awk '/^## Version:/ {print $3; exit}' RXP_Navigator.toc)"
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not resolve version from RXP_Navigator.toc" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          ASSET="RestedXP-Navigator-${TAG}.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build addon package
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/RXP_Navigator" "$RUNNER_TEMP/${{ steps.vars.outputs.asset }}"
          mkdir -p "$RUNNER_TEMP/RXP_Navigator"
          cp RXP_Navigator.toc "$RUNNER_TEMP/RXP_Navigator/"
          cp -R Core UI Map Debug Docs Media "$RUNNER_TEMP/RXP_Navigator/"
          cd "$RUNNER_TEMP"
          zip -qr "${{ steps.vars.outputs.asset }}" RXP_Navigator

      - name: Create GitHub release
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          ASSET="$RUNNER_TEMP/${{ steps.vars.outputs.asset }}"
          NOTES="Docs/RELEASE-${TAG}.md"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ steps.vars.outputs.release_sha }}" \
              --title "RestedXP-Navigator $TAG" \
              --notes-file "$NOTES"
          fi

      - name: Upload to CurseForge
        shell: bash
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "CURSEFORGED secret is missing." >&2
            exit 1
          fi

          jq -n \
            --rawfile changelog "Docs/RELEASE-${{ steps.vars.outputs.tag }}.md" \
            --arg displayName "RestedXP-Navigator ${{ steps.vars.outputs.tag }}" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: ["1.60.1"],
              releaseType: "release"
            }' > "$RUNNER_TEMP/metadata.json"

          curl --fail-with-body --show-error --silent \
            -H "X-Api-Token: $CF_TOKEN" \
            -F "metadata=<$RUNNER_TEMP/metadata.json;type=application/json" \
            -F "file=@$RUNNER_TEMP/${{ steps.vars.outputs.asset }};type=application/zip" \
            "https://www.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
