name: Publish current v1.4.0 to CurseForge

on:
  push:
    paths:
      - ".github/workflows/publish-current-v1.4.0-to-curseforge.yml"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CURSEFORGE_PROJECT_ID: "1722407"
      CURSEFORGE_API_BASE: "https://www.curseforge.com/api"
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGED }}
      TAG: "v1.4.0"
      ARCHIVE_NAME: "RestedXP-Navigator-v1.4.0.zip"
      CURSEFORGE_GAME_VERSION: "1.60.1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download GitHub release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfupload"
          gh release download "$TAG"             --repo "$GITHUB_REPOSITORY"             --pattern "$ARCHIVE_NAME"             --dir "$RUNNER_TEMP/cfupload"

      - name: Create CurseForge metadata
        shell: bash
        run: |
          set -euo pipefail
          git show "$TAG:Docs/RELEASE-v1.4.0.md" > "$RUNNER_TEMP/release_body.md"

          python3 <<'PY'
import json, os, pathlib
body = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release_body.md"
metadata = {
    "changelog": body.read_text(encoding="utf-8"),
    "changelogType": "markdown",
    "displayName": "RestedXP-Navigator v1.4.0",
    "gameVersionNames": [os.environ["CURSEFORGE_GAME_VERSION"]],
    "releaseType": "release",
}
(pathlib.Path(os.environ["RUNNER_TEMP"]) / "curseforge-metadata.json").write_text(
    json.dumps(metadata, ensure_ascii=False), encoding="utf-8"
)
PY

      - name: Upload v1.4.0 to CurseForge
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent             -H "X-Api-Token: $CURSEFORGE_TOKEN"             -F "metadata=@$RUNNER_TEMP/curseforge-metadata.json;type=application/json"             -F "file=@$RUNNER_TEMP/cfupload/$ARCHIVE_NAME;type=application/zip"             "$CURSEFORGE_API_BASE/projects/$CURSEFORGE_PROJECT_ID/upload-file"             | tee "$RUNNER_TEMP/curseforge-upload-response.json"

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-current-v1.4.0-to-curseforge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time CurseForge v1.4.0 publisher"
          git push origin HEAD:main
